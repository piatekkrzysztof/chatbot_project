services:
  - type: web
    name: chatbot-backend
    runtime: python
    buildCommand: "./build.sh"
    # Workery wątkowe, nie synchroniczne: odpowiedzi czatu lecą strumieniem (SSE)
    # i trzymają połączenie przez cały czas generowania. Przy domyślnym workerze
    # synchronicznym kilka równoczesnych rozmów zablokowałoby cały serwer.
    startCommand: "gunicorn chatbot_project.wsgi:application --worker-class gthread --threads 8 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis

  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "celery -A chatbot_project worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis

  - type: worker
    name: celery-beat
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "celery -A chatbot_project beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis

  - type: redis
    name: chatbot-redis
