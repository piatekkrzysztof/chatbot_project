# Opis usług na Renderze.
#
# UWAGA NA PUŁAPKĘ: ten plik nie tworzy niczego sam z siebie. Usługi założone
# ręcznie w panelu nie powstają z blueprintu i nie są z nim synchronizowane —
# obecność wpisu tutaj nie jest dowodem, że usługa istnieje i chodzi.
# Do sprawdzenia stanu faktycznego służy /api/diagnostyka/zadania/.
#
# Zmienne oznaczone `sync: false` Render wypełnia z panelu, a nie z tego pliku.
# Wypisujemy je mimo to, bo worker i beat startują Django tak samo jak proces
# web: bez DATABASE_URL i DJANGO_SECRET_KEY nie wstaną, tylko wywalą się przy
# imporcie ustawień. Wcześniej deklarowały wyłącznie REDIS_URL i wyglądałoby
# to na poprawną konfigurację aż do pierwszego uruchomienia.

services:
  - type: web
    name: chatbot-backend
    runtime: python
    buildCommand: "./build.sh"
    # Workery wątkowe, nie synchroniczne: odpowiedzi czatu lecą strumieniem (SSE)
    # i trzymają połączenie przez cały czas generowania. Przy domyślnym workerze
    # synchronicznym kilka równoczesnych rozmów zablokowałoby cały serwer.
    startCommand: "gunicorn chatbot_project.wsgi:application --worker-class gthread --threads 8 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis
          # Bez `property` Render odrzuca blueprint. Dla Redisa dozwolone są
          # connectionString, host i port — Celery potrzebuje pełnego adresu.
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_PROXY_DEPTH
        sync: false
      # UWAGA: te zmienne muszą być IDENTYCZNE na obu usługach. Render trzyma
      # je osobno dla każdej i nic ich ze sobą nie porównuje, a wklepuje się
      # je ręcznie. Realnie rozjechały się dwa razy: EMAIL_HOST = "stmp..."
      # na web i DEFAULT_FROM_EMAIL z podkreślnikiem w domenie na workerze.
      # Obie literówki wyszły dopiero przy prawdziwym zapytaniu od klienta.
      # Do sprawdzenia stanu faktycznego: `manage.py sprawdz_poczte` (web)
      # oraz zadanie `sprawdz_poczte_task` (worker).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Nadawca osobno od loginu SMTP: u dostawców transakcyjnych login jest
      # techniczny (w Resendzie dosłownie „resend"), a nadawcą musi być
      # zweryfikowany adres w domenie.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Jedna usługa robi obie rzeczy: odbiera zadania z kolejki ORAZ pełni rolę
  # zegara (flaga --beat). Tak stoi na produkcji od 14.08.2026.
  #
  # Rozdzielenie na dwie usługi jest solidniejsze — restart workera nie
  # restartuje wtedy zegara — ale Render liczy każdą usługę osobno, a przy
  # obecnej skali (dwa zadania cykliczne na dobę) nie ma to znaczenia.
  # Gdy pojawi się realny ruch, warto wrócić do dwóch usług.
  #
  # PRZY WARIANCIE Z --beat MUSI BYĆ DOKŁADNIE JEDNA INSTANCJA. Druga oznacza
  # dwa zegary, czyli podwójne pobieranie stron u każdego klienta i podwójne
  # czyszczenie RODO.
  #
  # Build tylko instaluje zależności. Migracje i pliki statyczne robi proces
  # web — to on jest właścicielem schematu. Gdy wszystkie usługi puszczały
  # ./build.sh, każde wdrożenie uruchamiało `migrate` równolegle w kilku
  # procesach i `collectstatic` tam, gdzie statyków się nie serwuje.
  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A chatbot_project worker --beat --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis
          # Bez `property` Render odrzuca blueprint. Dla Redisa dozwolone są
          # connectionString, host i port — Celery potrzebuje pełnego adresu.
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # UWAGA: te zmienne muszą być IDENTYCZNE na obu usługach. Render trzyma
      # je osobno dla każdej i nic ich ze sobą nie porównuje, a wklepuje się
      # je ręcznie. Realnie rozjechały się dwa razy: EMAIL_HOST = "stmp..."
      # na web i DEFAULT_FROM_EMAIL z podkreślnikiem w domenie na workerze.
      # Obie literówki wyszły dopiero przy prawdziwym zapytaniu od klienta.
      # Do sprawdzenia stanu faktycznego: `manage.py sprawdz_poczte` (web)
      # oraz zadanie `sprawdz_poczte_task` (worker).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Nadawca osobno od loginu SMTP: u dostawców transakcyjnych login jest
      # techniczny (w Resendzie dosłownie „resend"), a nadawcą musi być
      # zweryfikowany adres w domenie.
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: redis
    name: chatbot-redis
    ipAllowList: []
