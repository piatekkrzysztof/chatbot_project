# Opis usług na Renderze.
#
# UWAGA NA PUŁAPKĘ: ten plik nie tworzy niczego sam z siebie. Usługi założone
# ręcznie w panelu nie powstają z blueprintu i nie są z nim synchronizowane —
# obecność wpisu tutaj nie jest dowodem, że usługa istnieje i chodzi.
# Do sprawdzenia stanu faktycznego służy /api/diagnostyka/zadania/.
#
# Zmienne oznaczone `sync: false` Render wypełnia z panelu, a nie z tego pliku.
# Wypisujemy je mimo to, bo worker i beat startują Django tak samo jak proces
# web: bez DATABASE_URL i DJANGO_SECRET_KEY nie wstaną, tylko wywalą się przy
# imporcie ustawień. Wcześniej deklarowały wyłącznie REDIS_URL i wyglądałoby
# to na poprawną konfigurację aż do pierwszego uruchomienia.

services:
  - type: web
    name: chatbot-backend
    runtime: python
    buildCommand: "./build.sh"
    # Workery wątkowe, nie synchroniczne: odpowiedzi czatu lecą strumieniem (SSE)
    # i trzymają połączenie przez cały czas generowania. Przy domyślnym workerze
    # synchronicznym kilka równoczesnych rozmów zablokowałoby cały serwer.
    startCommand: "gunicorn chatbot_project.wsgi:application --worker-class gthread --threads 8 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis
          # Bez `property` Render odrzuca blueprint. Dla Redisa dozwolone są
          # connectionString, host i port — Celery potrzebuje pełnego adresu.
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_PROXY_DEPTH
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Odbiera zadania zlecane z żądań: przetwarzanie wgranych dokumentów,
  # liczenie embeddingów, pobieranie stron WWW.
  #
  # Build tylko instaluje zależności. Migracje i pliki statyczne robi proces
  # web — to on jest właścicielem schematu. Gdy wszystkie trzy usługi puszczały
  # ./build.sh, każde wdrożenie uruchamiało `migrate` trzykrotnie równolegle
  # i `collectstatic` w procesach, które statyków w ogóle nie serwują.
  - type: worker
    name: celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A chatbot_project worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis
          # Bez `property` Render odrzuca blueprint. Dla Redisa dozwolone są
          # connectionString, host i port — Celery potrzebuje pełnego adresu.
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # Wyłącznie zegar: co dwanaście godzin zleca pobranie stron WWW, a raz
  # na dobę czyszczenie rozmów po okresie retencji (RODO). Sam niczego nie
  # wykonuje — bez działającego celery-worker zlecenia trafiają do kolejki
  # i tam zostają.
  #
  # Musi być dokładnie jedna instancja. Dwie oznaczają podwójne uruchomienia
  # każdego zadania, w tym podwójne pobieranie stron u każdego klienta.
  - type: worker
    name: celery-beat
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A chatbot_project beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: REDIS_URL
        fromService:
          name: chatbot-redis
          type: redis
          # Bez `property` Render odrzuca blueprint. Dla Redisa dozwolone są
          # connectionString, host i port — Celery potrzebuje pełnego adresu.
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: redis
    name: chatbot-redis
    ipAllowList: []
