[pytest]
addopts = --reuse-db --create-db
DJANGO_SETTINGS_MODULE = chatbot_project.settings.dev
python_files = tests.py test_*.py *_tests.py
markers =
    wolno_uzyc_klienta_openai: test celowo siega po fabryke klienta OpenAI (nie dzwoni nigdzie)
filterwarnings =
    ignore::DeprecationWarning:sentry_sdk.*

