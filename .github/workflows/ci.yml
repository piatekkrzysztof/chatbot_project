name: CI

on:
  push:
    branches: [main]
  pull_request:

# Zadania jakości (ruff, mypy, bandit, pip-audit, coverage) są w tym przebiegu
# świadomie NIEBLOKUJĄCE. Ten kod nigdy nie był lintowany ani typowany, więc
# włączenie ich od razu jako warunku przejścia zamieniłoby CI z powrotem
# w czerwone — a czerwone CI, którego nikt nie czyta, jest gorsze niż jego brak.
#
# Każde z nich wypisuje wynik do podsumowania przebiegu. Kolejny krok to
# odczytanie tych liczb i ustawienie progów tuż poniżej zmierzonych wartości,
# a potem podnoszenie ich przy kolejnych zmianach.
#
# Jedyne nowe zadanie, które BLOKUJE od razu, to budowa obrazu: albo się buduje,
# albo nie, nie ma tu nic do wytarowania.

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # obraz z gotowym rozszerzeniem pgvector — migracje same je włączają
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
      DEV_DB_NAME: saas_restore_ci
      DEV_DB_USER: postgres
      DEV_DB_PASSWORD: postgres
      DEV_DB_HOST: localhost
      DEV_DB_PORT: 5432
      # Testy mockują wywołania do OpenAI — prawdziwy klucz nie jest potrzebny
      OPENAI_API_KEY: not-used-tests-are-mocked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Kontrola konfiguracji Django
        run: python manage.py check

      - name: Brak niezastosowanych zmian w modelach
        run: python manage.py makemigrations --check --dry-run

      - name: Testy
        run: pytest -q

  pokrycie:
    name: Pokrycie testami
    runs-on: ubuntu-latest

    # Osobne zadanie, nie dodatkowy krok w `test`. Tamto zadanie blokuje
    # przejście CI, więc nie może zależeć od narzędzia, którego zachowania
    # nie sprawdzono — awaria pytest-cov zamieniłaby zielony suite w czerwony
    # z powodu niemającego nic wspólnego z kodem.
    #
    # Kosztuje drugi przebieg testów. Do scalenia z `test`, gdy próg pokrycia
    # zacznie faktycznie blokować i pytest-cov będzie sprawdzonym elementem.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
      DEV_DB_NAME: saas_restore_ci
      DEV_DB_USER: postgres
      DEV_DB_PASSWORD: postgres
      DEV_DB_HOST: localhost
      DEV_DB_PORT: 5432
      OPENAI_API_KEY: not-used-tests-are-mocked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pomiar
        # Próg 83% pochodzi z POMIARU, nie z sufitu: pierwszy przebieg CI
        # zgłosił 85% pokrycia gałęziowego (bez migracji i testów). Zostawiamy
        # dwa punkty zapasu, bo pojedynczy nowy moduł potrafi zbić wynik o
        # punkt, a próg, który czerwieni CI przy każdym dodanym pliku, kończy
        # się wyłączeniem progu.
        #
        # Podnosimy go przy kolejnych zmianach — 83 jest podłogą, nie celem.
        run: |
          pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=83
          {
            echo "## Pokrycie testami"
            echo ""
            echo '```'
            coverage report --skip-covered --sort=cover | tail -45
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Adnotacja, nie tylko podsumowanie: treść $GITHUB_STEP_SUMMARY widać
          # dopiero po zalogowaniu, a adnotacje są publiczne. Dzięki temu liczbę
          # widzi każdy, kto otworzy przebieg — łącznie z kimś, kto ogląda
          # repozytorium bez konta.
          PROCENT=$(coverage report --format=total 2>/dev/null || echo "?")
          echo "::notice title=Pokrycie testami::${PROCENT}% (gałęziowe, bez migracji i testów)"
        # Bez continue-on-error: od tej chwili spadek poniżej progu zatrzymuje
        # scalenie. To jest cały sens ustawiania progu.

      - name: Zachowaj raport
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: pokrycie
          path: coverage.xml
          if-no-files-found: warn

  jakosc:
    name: Jakość kodu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja narzędzi
        run: pip install ruff

      - name: Ruff — analiza
        # Zapadka, nie cel. Próg stoi DOKŁADNIE na zmierzonej liczbie, bez
        # zapasu: zapas jest miejscem, w które dług wraca po cichu.
        #
        # 4 września 2026 było 203 trafienia, 15 września 29. Zostało 15
        # (F24 cz. 2) i wszystkie mają powód, dla którego zostają:
        #
        #   DJ001 (9) — pola tekstowe z null=True; poprawka to zmiana schematu
        #               i migracja na żywej bazie, nie porządki,
        #   DJ012 (6) — kolejność elementów w modelu; czysta kosmetyka,
        #               przestawianie ciała modeli niesie ryzyko bez korzyści.
        #
        # Długie wiersze będące treścią (szablon e-maila, strony HTML w fixturach)
        # mają wyjątek w pyproject.toml; pozostałe zostały złamane.
        #
        # Obniżenie progu przy okazji innej pracy jest mile widziane. Podniesienie
        # wymaga wpisania tu powodu — inaczej ta lista przestanie cokolwiek znaczyć.
        run: |
          {
            echo "## Ruff — analiza"
            echo ""
            echo '```'
            ruff check . --output-format=concise 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ruff check . --statistics 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY" || true

          # Oba strumienie do pliku i liczenie z pliku. Poprzedni licznik
          # formatowania miał tu `2>/dev/null`, gubił wiersze ze STDERR
          # i podawał zero niezależnie od stanu kodu — ta sama pułapka.
          ruff check . --output-format=concise > ruff.txt 2>&1 || true
          ILE=$(grep -c . ruff.txt || true)
          # 15.09.2026: obniżony z 50 do 29, potem do 15 (F24).
          PROG=15

          echo "::notice title=Ruff::${ILE} trafień (próg: ${PROG})"

          if [ -z "$ILE" ]; then
            echo "::error title=Ruff::nie odczytano liczby trafień"
            tail -20 ruff.txt
            exit 1
          fi

          if [ "$ILE" -gt "$PROG" ]; then
            echo "::error title=Ruff::${ILE} trafień, próg ${PROG} — dług rośnie"
            echo "Nowe trafienia względem progu:"
            ruff check . --statistics 2>&1 | tail -20
            exit 1
          fi

          if [ "$ILE" -lt "$PROG" ]; then
            echo "::notice title=Ruff::poniżej progu o $((PROG - ILE)) — obniż PROG w ci.yml do ${ILE}"
          fi

      - name: Ruff — formatowanie
        run: |
          {
            echo ""
            echo "## Ruff — formatowanie"
            echo ""
            echo '```'
            ruff format --check --diff . 2>&1 | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Oba strumienie do pliku. Poprzednia wersja miała tu `2>/dev/null`
          # i liczyła wiersze "Would reformat" ze STDOUT — a ruff wypisuje je
          # na STDERR. Licznik wyrzucał więc dokładnie to, co miał policzyć,
          # i podawał ZERO niezależnie od stanu kodu.
          #
          # Kosztowało to więcej niż samą złą liczbę: na jej podstawie ten krok
          # został ustawiony jako blokujący, po czym CI stanęło na czerwono przy
          # pierwszym uruchomieniu. Próg postawiony na odczycie z zepsutego
          # instrumentu jest gorszy niż brak progu.
          ruff format --check . > format.txt 2>&1 || true

          # Czytamy WIERSZ PODSUMOWANIA, nie pojedyncze wpisy "Would reformat".
          # Ruff przy większej liczbie plików nie wypisuje ich po kolei, tylko
          # samo podsumowanie w rodzaju "165 files would be reformatted,
          # 23 files already formatted". Licznik oparty na wpisach zwracał więc
          # zero mimo 165 plików do poprawy - i to zero trafiło do adnotacji
          # wyglądającej na pomiar.
          ILE=$(grep -oE '[0-9]+ files? would be reformatted' format.txt | grep -oE '^[0-9]+' || true)
          PODSUMOWANIE=$(tail -1 format.txt | cut -c1-140)

          if [ -n "$ILE" ]; then
            echo "::notice title=Formatowanie::${ILE} plików do przeformatowania"
          elif grep -q "already formatted" format.txt; then
            echo "::notice title=Formatowanie::0 plików do przeformatowania (${PODSUMOWANIE})"
          else
            # Brak obu wzorców znaczy, że raport ma nieznany kształt.
            # Ostrzeżenie, nie cicha zerowa liczba.
            echo "::warning title=Formatowanie::nie odczytano wyniku, ostatni wiersz: ${PODSUMOWANIE:-brak}"
          fi

          # Teraz blokuje - i tym razem na zmierzonej liczbie, nie na odczycie
          # z zepsutego licznika. Cały kod został przeformatowany, `ruff format
          # --check` zgłasza "188 files already formatted", a pakiet 855 testów
          # przeszedł po tej zmianie bez zmian.
          ruff format --check .

  typy:
    name: Typy
    runs-on: ubuntu-latest
    # Plugin django-stubs importuje ustawienia Django, a te bez sekretu przerywają
    # import - mypy kończył się bez podsumowania (pierwszy przebieg F24).
    # Wartości syntetyczne, jak w zadaniu test; mypy nie łączy się z bazą.
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
      DEV_DB_NAME: saas_restore_ci
      DEV_DB_USER: postgres
      DEV_DB_PASSWORD: postgres
      DEV_DB_HOST: localhost
      DEV_DB_PORT: 5432
      OPENAI_API_KEY: not-used-tests-are-mocked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install mypy 'django-stubs[compatible-mypy]'

      - name: Mypy
        run: |
          {
            echo "## Mypy"
            echo ""
            echo '```'
            mypy . 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mypy . > mypy.txt 2>&1 || true

          # Liczba z WIERSZA PODSUMOWANIA, nie z liczenia "error:". Gdy mypy się
          # wywróci (np. plugin Django nie wczyta ustawień), linii z błędami
          # nie ma wcale - licznik dałby zero i zielony krok bez sprawdzenia.
          PODSUMOWANIE=$(grep -E "^(Found [0-9]+ errors? in|Success: no issues found)" mypy.txt || true)
          if [ -z "$PODSUMOWANIE" ]; then
            echo "::error title=Mypy::brak podsumowania - mypy nie zakończył sprawdzania"
            tail -30 mypy.txt
            exit 1
          fi
          ILE=$(echo "$PODSUMOWANIE" | grep -oE "^Found [0-9]+" | grep -oE "[0-9]+" || echo 0)

          # Zapadka jak przy ruff (F24, 15.09.2026). Do tej pory krok nie
          # blokował i dług rósł po cichu: audyt 12.09 zmierzył 218 błędów,
          # 15.09 było 223. Plugin django-stubs zdjął 176 fałszywych trafień
          # z pól modeli, poprawki w kodzie resztę (F24 cz. 2) - zero błędów.
          # Każdy nowy błąd typów zatrzymuje scalenie.
          PROG=0

          # Sama liczba nie wystarcza: żeby naprawić błąd, trzeba wiedzieć,
          # który. Podsumowanie przebiegu widać dopiero po zalogowaniu, więc
          # pierwszy błąd trafia wprost do adnotacji.
          PIERWSZY=$(grep -m1 "error:" mypy.txt | cut -c1-200 || true)
          echo "::notice title=Mypy::${ILE} błędów typów (próg: ${PROG}) — pierwszy: ${PIERWSZY:-brak}"

          if [ "$ILE" -gt "$PROG" ]; then
            echo "::error title=Mypy::${ILE} błędów, próg ${PROG} — dług rośnie"
            grep "error:" mypy.txt | tail -20
            exit 1
          fi
          if [ "$ILE" -lt "$PROG" ]; then
            echo "::notice title=Mypy::poniżej progu o $((PROG - ILE)) — obniż PROG w ci.yml do ${ILE}"
          fi

  bezpieczenstwo:
    name: Bezpieczeństwo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja narzędzi
        # bandit[toml] — bez tego dodatku `-c pyproject.toml` nie zadziała
        run: pip install 'bandit[toml]' pip-audit

      - name: Bandit
        # Testy są wyłączone w pyproject.toml — celowo używają rzeczy, które
        # w kodzie produkcyjnym byłyby podejrzane (assert, hasła w kodzie),
        # i zalewałyby raport szumem.
        run: |
          {
            echo "## Bandit"
            echo ""
            echo '```'
            bandit -c pyproject.toml -r . -f txt 2>&1 | tail -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # JSON do PLIKU, nie przez potok. Poprzednia wersja czytała stdout
          # bandita i obie liczby wychodziły jako "?" — adnotacja wyglądała
          # na wynik pomiaru, a była śladem po nieudanej ekstrakcji.
          bandit -c pyproject.toml -r . -f json -o bandit.json 2>bandit.err || true
          if [ -s bandit.json ]; then
            RAZEM=$(python -c "import json; print(len(json.load(open('bandit.json')).get('results',[])))")
            WYSOKIE=$(python -c "import json; print(sum(1 for x in json.load(open('bandit.json')).get('results',[]) if x['issue_severity']=='HIGH'))")
            echo "::notice title=Bandit::${RAZEM} znalezisk, w tym ${WYSOKIE} o wysokiej wadze"
          else
            # Błąd, nie ostrzeżenie: krok blokuje, więc brak wyniku nie może
            # przejść jako brak znalezisk.
            echo "::error title=Bandit::nie udało się odczytać wyniku: $(head -c 300 bandit.err)"
            exit 1
          fi

          # Blokuje waga średnia i wysoka (F24, 15.09.2026). Niskie (random
          # w danych demo, subprocess w izolowanym parserze) zostają w raporcie.
          # Fałszywe trafienie oznacza się w kodzie `# nosec B<numer>` z powodem.
          POWAZNE=$(python -c "import json; print(sum(1 for x in json.load(open('bandit.json')).get('results',[]) if x['issue_severity'] in ('MEDIUM','HIGH')))")
          if [ "$POWAZNE" -gt 0 ]; then
            echo "::error title=Bandit::${POWAZNE} znalezisk o wadze średniej lub wysokiej"
            python -c "import json; [print(x['issue_severity'], x['test_id'], x['filename'], x['line_number'], x['issue_text']) for x in json.load(open('bandit.json')).get('results',[]) if x['issue_severity'] in ('MEDIUM','HIGH')]"
            exit 1
          fi

      - name: pip-audit — zależności produkcyjne
        run: |
          {
            echo ""
            echo "## pip-audit"
            echo ""
            echo '```'
            pip-audit -r requirements.txt --progress-spinner off 2>&1 | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ILE=$(pip-audit -r requirements.txt --progress-spinner off -f json 2>/dev/null             | python -c "import sys,json; d=json.load(sys.stdin); print(sum(len(p.get('vulns',[])) for p in d.get('dependencies',[])))" 2>/dev/null || echo "?")
          echo "::notice title=pip-audit::${ILE} podatności w zależnościach produkcyjnych"
          # Blokuje każda znana podatność (F24, 15.09.2026) - i nieudany odczyt.
          # Nowa podatność w zależności zatrzyma też PR, który jej nie dotyczy:
          # to celowe, bo inaczej nikt jej nie podbije.
          if [ "$ILE" != "0" ]; then
            echo "::error title=pip-audit::${ILE} podatności albo nieudany odczyt wyniku"
            pip-audit -r requirements.txt --progress-spinner off 2>&1 | tail -20
            exit 1
          fi

  obraz:
    name: Obraz Docker
    runs-on: ubuntu-latest

    # To zadanie blokuje. Obraz albo się buduje, albo nie — nie ma tu progu
    # do wytarowania. Zweryfikowane lokalnie przed dodaniem: buduje się.
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Syntetyczne sekrety i dane poza kontekstem obrazu
        run: |
          mkdir -p media backups chatbot_project/media chatbot_project/backups .venv
          mkdir -p chatbot_project/private-media
          python - <<'PY'
          from pathlib import Path
          paths = [
              '.env.image-check', 'chatbot_project/.env.image-check',
              'media/private.txt', 'backups/private.json',
              'chatbot_project/media/private.py', 'chatbot_project/backups/private.py',
              '.venv/private.py', 'chatbot_project/private.key',
              'chatbot_project/private.sqlite3',
              'chatbot_project/settings/private.json',
              'chatbot_project/private-media/private.py',
          ]
          for package in ('accounts', 'api', 'chat', 'chatbot_project', 'documents', 'rag'):
              paths.append(f'{package}/private.txt')
          for name in paths:
              Path(name).write_text('SYNTHETIC_IMAGE_EXCLUSION_CHECK', encoding='utf-8')
          PY

      - name: Budowa obrazu
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chatbot-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Obraz nie zawiera sekretów, danych ani zależności testowych
        run: |
          docker run --rm -i chatbot-backend:ci python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          root = Path('/app')
          assert os.geteuid() != 0, 'Aplikacja działa jako root'
          for path in root.rglob('*'):
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  assert path.suffix == '.py' or relative in (
                      'requirements.txt', 'rag/ocena/wzorzec.json',
                      'accounts/templates/admin/mfa_login.html',
                  ), relative
                  assert not path.name.startswith('.env'), path
                  assert b'SYNTHETIC_IMAGE_EXCLUSION_CHECK' not in path.read_bytes(), path
          for name in ('.git', '.venv', 'venv', 'media', 'backups', 'conftest.py',
                       'requirements-dev.txt', 'documents/test.pdf'):
              assert not (root / name).exists(), name
          assert not list(root.rglob('test_*.py'))
          assert not list(root.rglob('tests.py'))
          assert not list(root.rglob('tests'))
          for package in ('pytest', 'factory', 'reportlab'):
              assert importlib.util.find_spec(package) is None, package
          for name in ('accounts/models.py', 'api/views/widget.py', 'chat/models.py',
                       'documents/models.py', 'chatbot_project/settings/prod.py',
                       'rag/ocena/wzorzec.json', 'accounts/templates/admin/mfa_login.html'):
              assert (root / name).is_file(), name
          print('Kod runtime obecny; sekrety, dane i narzędzia testowe wykluczone')
          PY

      - name: Obraz wstaje i widzi swoją konfigurację
        run: |
          docker run --rm \
            -e DJANGO_ENV=prod \
            -e DJANGO_SECRET_KEY=ci-secret-key-not-used-outside-ci \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/nieuzywana \
            -e DJANGO_ALLOWED_HOSTS=example.com \
            -e OPENAI_API_KEY=not-used-nothing-is-called \
            chatbot-backend:ci \
            python -c "from chatbot_project.wsgi import application; print('WSGI OK')"

  zaleznosci-produkcyjne:
    name: Zależności produkcyjne
    runs-on: ubuntu-latest

    # Testy instalują requirements-dev.txt, więc pakiet brakujący w
    # requirements.txt potrafi wejść ubocznie z zależności deweloperskiej
    # i cały suite przechodzi mimo to. Tak przepadło kiedyś lxml_html_clean:
    # 231 testów na zielono, a gunicorn nie wstawał na produkcji, bo aplikacji
    # WSGI nie dawało się zaimportować. To zadanie instaluje dokładnie to,
    # co instaluje Render, i sprawdza, czy aplikacja w ogóle się podnosi.
    env:
      DJANGO_ENV: prod
      DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nieuzywana
      DJANGO_ALLOWED_HOSTS: example.com
      OPENAI_API_KEY: not-used-nothing-is-called

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalacja wyłącznie zależności produkcyjnych
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kontrola konfiguracji Django
        run: python manage.py check

      - name: Aplikacja WSGI się importuje (to uruchamia gunicorn)
        run: python -c "from chatbot_project.wsgi import application"

      - name: Celery się ładuje (worker i beat)
        run: python -c "from chatbot_project.celery import app"
